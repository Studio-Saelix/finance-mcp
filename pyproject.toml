[project]
name = "studio-saelix-finance"
version = "0.1.0"
description = "Read-only Studio Saelix Finance MCP server for Plaid-connected accounts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Studio Saelix" }]
keywords = ["plaid", "mcp", "claude", "chatgpt", "finance", "llm", "fintech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "fastmcp>=2.2.0",
    "plaid-python>=36.0.0",
    "pydantic>=2.6",
    "cryptography>=43.0",
    "click>=8.1",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/Studio-Saelix/finance-mcp"
Repository = "https://github.com/Studio-Saelix/finance-mcp"
Issues = "https://github.com/Studio-Saelix/finance-mcp/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["sandbox: tests that hit the real Plaid sandbox API (skipped without .env.test)"]
testpaths = ["tests"]

[project.scripts]
studio-saelix-finance = "plaid_mcp.admin:main"
studio-saelix-finance-mcp = "plaid_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plaid_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src/plaid_mcp", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
